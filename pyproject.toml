[project]
name = "mcp-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eslam-ahmed43", email = "198592060+eslam-ahmed43@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
]

[project.scripts]
mcp-lab = "mcp_lab:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["m2_gateway"]
testpaths = ["tests"]
